# Cashow — single-host Docker Compose stack.
#
#   web       Next.js standalone output on Bun               (port 3000)
#   worker    background jobs and notifications              (backend)
#   migrate   one-shot schema migration before web/worker     (backend)
#   postgres  pinned pgvector/pgvector:pg17, named volume     (backend)
#   backup    nightly pg_dump + age -> local BACKUP_DIR      (profile: backup)
#
# Postgres is internal only. An external reverse proxy routes traffic to `web:3000`.
# Start:   docker compose up -d --build
# Migrate: docker compose run --rm migrate
# Backup:  docker compose --profile backup up -d
#
# Copy `.env.example` to `.env` first; Compose reads it for substitution and
# passes it to the containers.

name: cashow

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-cashow}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cashow}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  AUTH_SECRET: ${AUTH_SECRET:-}
  SETUP_TOKEN: ${SETUP_TOKEN:-}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
  WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Cashow}
  COMPAT_TOKEN: ${COMPAT_TOKEN:-}
  GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
  GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-2.5-flash}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
  DEEPSEEK_PRO_MODEL: ${DEEPSEEK_PRO_MODEL:-deepseek-reasoner}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  NTFY_TOPIC: ${NTFY_TOPIC:-}
  NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}
  NTFY_TOKEN: ${NTFY_TOKEN:-}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_DIR: /app/data/uploads
  TZ: ${TZ:-Asia/Jakarta}

x-app-service: &app-service
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cashow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cashow}
      TZ: UTC
    security_opt:
      - no-new-privileges:true
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=500
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - backend

  migrate:
    build:
      context: .
      target: worker
    image: ${CASHOW_WORKER_IMAGE:-ghcr.io/dhanuprys/cashow:worker}
    command: ["bun", "run", "--filter", "@cashow/db", "db:migrate"]
    environment: *app-env
    restart: "no"
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  web:
    <<: *app-service
    build:
      context: .
      target: web
    image: ${CASHOW_WEB_IMAGE:-ghcr.io/dhanuprys/cashow:latest}
    environment:
      <<: *app-env
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - files:/app/data
      - next_cache:/app/apps/web/.next/cache
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  worker:
    <<: *app-service
    build:
      context: .
      target: worker
    image: ${CASHOW_WORKER_IMAGE:-ghcr.io/dhanuprys/cashow:worker}
    environment:
      <<: *app-env
      # The freshness rule reads last-run.json / last-drill.json from here.
      BACKUP_DIR: /backups
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - files:/app/data
      - ${BACKUP_DIR:-./backups}:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  # Nightly backup. Disabled by default so the base stack starts without a
  # backup key; enable with: docker compose --profile backup up -d
  backup:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-cashow}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-cashow}
      BACKUP_DIR: /backups
      STORAGE_DIR: /files/uploads
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_AGE_KEY: ${BACKUP_AGE_KEY:-/secrets/age.key}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      TZ: UTC
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - files:/files:ro
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

volumes:
  pgdata:
  files:
  next_cache:

networks:
  backend:
    driver: bridge
